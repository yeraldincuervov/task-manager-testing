appId: com.taskmanager.app
---
# Flujo creado para la Actividad 3. Recorre creación, actualización y eliminación.
- launchApp:
    clearState: true
- assertVisible: "Task Manager"
- tapOn: "Flujo Todo List"
- assertVisible: "Nueva tarea"

- tapOn:
    id: "input-titulo"
- inputText: "Actividad 3 E2E"
- tapOn: "Guardar"
- assertVisible: "Tarea creada exitosamente"
- assertVisible: "Actividad 3 E2E"

- tapOn: "Marcar tarea Actividad 3 E2E como completada"
- assertVisible: ".*Completada.*"
- takeScreenshot:
    path: "actividad-3-tarea-completada"
    label: "Evidencia de la tarea creada y completada"

- tapOn: "Eliminar tarea Actividad 3 E2E"
- assertVisible: "Eliminar tarea"
- tapOn: "Confirmar eliminación de Actividad 3 E2E"
- assertNotVisible: "Actividad 3 E2E"
- takeScreenshot:
    path: "actividad-3-flujo-finalizado"
    label: "Evidencia del flujo E2E finalizado"
